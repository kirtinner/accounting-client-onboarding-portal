spring.application.name=accounting-client-onboarding-portal

spring.datasource.url=jdbc:postgresql://localhost:5432/accounting_onboarding
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.show-sql=false

xero.client-id=${XERO_CLIENT_ID:}
xero.client-secret=${XERO_CLIENT_SECRET:}
xero.redirect-uri=${XERO_REDIRECT_URI:http://localhost:8080/api/xero/callback}
