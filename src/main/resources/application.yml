# -----------------------------------------------------------------------------
# Frontend
# -----------------------------------------------------------------------------
frontend:
  base-url: ${FRONTEND_BASE_URL:http://localhost:5173}

# -----------------------------------------------------------------------------
# Application
# -----------------------------------------------------------------------------
application:
  email:
    from-name: ${EMAIL_FROM_NAME:Unfair Advantage Accounting}
    from-address: ${EMAIL_FROM_ADDRESS:${SMTP_USERNAME}}

# -----------------------------------------------------------------------------
# Spring Boot
# -----------------------------------------------------------------------------
spring:
  application:
    name: accounting-client-onboarding-portal

  datasource:
    url: jdbc:postgresql://localhost:5432/accounting_onboarding
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}

# -----------------------------------------------------------------------------
# Xero
# -----------------------------------------------------------------------------
xero:
  client-id: ${XERO_CLIENT_ID:}
  client-secret: ${XERO_CLIENT_SECRET:}
  redirect-uri: ${XERO_REDIRECT_URI:http://localhost:8080/api/xero/callback}

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging:
  file:
    name: logs/application.log

  level:
    root: WARN
    com.kzhastkou.accountingonboarding: WARN
    com.kzhastkou.accountingonboarding.invitation.scheduler: INFO